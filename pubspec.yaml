name: eczsearch              # >> Paket ismini tamamen küçük yapman daha doğru
description: Duty pharmacy finder app (EczSearch)
publish_to: "none"
version: 1.0.0+2           # İlk Play Store yayını için ideal

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2

  # kullandıkların
  il_ilce: ^1.0.4
  http: ^1.2.0
  geolocator: ^10.1.0
  geocoding: ^2.2.0
  url_launcher: ^6.3.0
  connectivity_plus: ^6.1.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.3.2
  provider: ^6.1.5+1
  flutter_phoenix: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    # - assets/translations/en.json
    # - assets/translations/tr.json

# Splash ekranı
flutter_native_splash:
  color: "#ffffff"
  color_dark: "#121212"
  image: assets/images/yeni_eczsearch_logo.png
  fullscreen: false

# Uygulama ikonu
flutter_launcher_icons:
  android: true
  ios: false
  min_sdk_android: 21

  # Hem Android hem iOS için ana görsel
  image_path: "assets/images/logo.png"

  # Android adaptive icon: beyaz arka plan + logo
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.png"
